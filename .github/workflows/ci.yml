name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "imgui.ini"]
  pull_request:
    paths-ignore: ["**.md", "imgui.ini"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with the SDK used locally (CLAUDE.md: Vulkan SDK 1.4.x)
  VULKAN_SDK_VERSION: 1.4.335.0
  VCPKG_DISABLE_METRICS: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (vs2026, MSVC)
            os: windows-2025-vs2026
            action: vs2026
            # Debug links the d-suffixed shaderc/spirv-cross libs, which ship in the SDK's debug component
            vulkan-components: com.lunarg.vulkan.debug
          - name: Linux (ninja, clang)
            os: ubuntu-24.04
            action: ninja
            vulkan-components: ""
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang ninja-build pkg-config uuid-dev \
            xorg-dev libxinerama-dev libxcursor-dev libglu1-mesa-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      # Pins live in Scripts/Setup.py; read them so CI never disagrees with local setup
      - name: Read pinned tool versions
        id: pins
        run: |
          python -c "import sys; sys.path.insert(0, 'Scripts'); import Setup; print(f'vcpkg-commit={Setup.VCPKG_COMMIT}'); print(f'premake-version={Setup.PREMAKE_VERSION}')" >> $env:GITHUB_OUTPUT

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          optional_components: ${{ matrix.vulkan-components }}
          install_runtime: false
          cache: true

      # Setup.py would otherwise pick up the runner's preinstalled vcpkg from PATH. A short root under
      # RUNNER_TEMP also keeps Windows buildtrees clear of MAX_PATH.
      - name: Provision pinned vcpkg
        env:
          VCPKG_COMMIT: ${{ steps.pins.outputs.vcpkg-commit }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          git init -q $root
          git -C $root fetch -q --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_COMMIT
          git -C $root checkout -q --detach FETCH_HEAD
          if ($IsWindows) { & "$root/bootstrap-vcpkg.bat" -disableMetrics } else { & sh "$root/bootstrap-vcpkg.sh" -disableMetrics }
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ steps.pins.outputs.vcpkg-commit }}-${{ env.VULKAN_SDK_VERSION }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'Dependencies/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Cache premake
        uses: actions/cache@v4
        with:
          path: .tools/premake/${{ steps.pins.outputs.premake-version }}/bin
          key: premake-${{ runner.os }}-${{ steps.pins.outputs.premake-version }}

      - name: Setup (premake, vcpkg install, generate)
        run: python Scripts/Setup.py --action ${{ matrix.action }} --yes

      # Saved right after setup so a later compile failure doesn't throw away a cold EppoCore build
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build Debug
        run: |
          $buildTool = (Get-Content .tools/build.json | ConvertFrom-Json).buildTool
          if ($IsWindows) { & $buildTool NeuralNetwork.slnx /m /nologo /v:minimal /p:Configuration=Debug /p:Platform=x64 }
          else { & $buildTool Debug_x64 }
          exit $LASTEXITCODE

      - name: Build Release
        run: |
          $buildTool = (Get-Content .tools/build.json | ConvertFrom-Json).buildTool
          if ($IsWindows) { & $buildTool NeuralNetwork.slnx /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64 }
          else { & $buildTool Release_x64 }
          exit $LASTEXITCODE
