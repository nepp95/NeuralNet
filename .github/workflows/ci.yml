name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            action: vs2026
          - os: ubuntu-24.04
            action: ninja
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config xorg-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.335.0
          optional_components: com.lunarg.vulkan.debug,com.lunarg.vulkan.vma
          install_runtime: false

      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'Dependencies/**') }}

      - name: Setup
        run: |
          mkdir -p .vcpkg-cache
          python Scripts/Setup.py --action ${{ matrix.action }} --yes

      - name: Build
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            msbuild="$(python -c "import json; print(json.load(open('.tools/build.json'))['buildTool'])")"
            for config in Debug Release; do
              "$msbuild" NeuralNetwork.slnx -m -p:Configuration=$config -p:Platform=x64
            done
          else
            ninja Debug_x64 Release_x64
          fi
